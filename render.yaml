services:
  - type: web
    name: creaseline-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build:backend
    startCommand: npm start
    healthCheckPath: /health/db
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: creaseline-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_SECONDS
        value: "3600"
      - key: CORS_ORIGIN
        value: https://creaseline.onrender.com
      - key: CAR_IMAGE_API_KEY
        sync: false

  - type: web
    name: creaseline
    runtime: static
    buildCommand: npm ci && npm run build:frontend
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://creaseline-api.onrender.com

databases:
  - name: creaseline-db
    databaseName: dealership_inventory
    user: dealership_app
    plan: starter
