name: dealershipinventory

services:
  db:
    image: postgres:17-alpine
    container_name: dealership-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealership_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealership_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dealership_inventory}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealership_app} -d ${POSTGRES_DB:-dealership_inventory}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dealership-inventory-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: development
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-dealership_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dealership_dev_secret}
      PGDATABASE: ${POSTGRES_DB:-dealership_inventory}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      CAR_IMAGE_API_KEY: ${CAR_IMAGE_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/public/images:/app/backend/public/images
      - ./backend/migrations:/app/backend/migrations
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dealership-inventory-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: dealershipinventory_postgres_data
